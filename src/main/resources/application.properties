# ===================================================
# Configuration par defaut (commune a tous les profils)
# ===================================================
spring.application.name=autoloc-api

# Port d'ecoute du serveur Web (8081 car 8080 est occupe par Oracle)
server.port=8081

# Profil actif par defaut
spring.profiles.active=dev

# Connexion a la base de donnees MySQL locale
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs en mode developpement
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=DEBUG
